name: Deploy to EC2

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Spring Boot 이미지 빌드 & Docker Hub push (Jib)
      - name: Build & Push Spring Boot image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew jib

      # Docker Buildx 설정 (레이어 캐싱 활성화)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ML Server 이미지 빌드 & Docker Hub push (GHA 레이어 캐시 사용)
      - name: Build & Push ML Server image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-server
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/capstone-ml:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # EC2에 SSH 접속해서 재배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/app
            export DOCKER_USERNAME=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
            /usr/local/bin/docker-compose pull
            /usr/local/bin/docker-compose up -d
            docker image prune -f
