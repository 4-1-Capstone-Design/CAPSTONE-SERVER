services:
  spring:
    image: ${DOCKER_USERNAME}/capstone-server:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  ml-server:
    image: ${DOCKER_USERNAME}/capstone-ml:latest
    ports:
      - "8000:8000"
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
